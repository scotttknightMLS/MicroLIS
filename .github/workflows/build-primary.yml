name: Build primary MLT SIM-LIS website

on:
  push:
    branches:
      - feat/primary-sim-lis-react
    paths:
      - 'app/**'
      - 'package.json'
      - 'vite.config.mjs'
      - 'postcss.config.cjs'
      - 'tailwind.config.cjs'
      - '.github/workflows/build-primary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Compile React and Tailwind
        run: npm run build
      - name: Check generated website
        run: |
          test -s dist/index.html
          test -d dist/site-assets
          grep -q 'site-assets' dist/index.html
      - name: Stage production files without changing preview/
        run: |
          rm -rf site-assets
          cp -R dist/site-assets site-assets
          cp dist/index.html index.html
          touch .nojekyll
      - name: Commit compiled HTML and assets to this feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html site-assets .nojekyll
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'build: compile MLT SIM-LIS for branch-based GitHub Pages'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

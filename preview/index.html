<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Micro LIS Preview | Clinical Microbiology Simulation</title>
<meta name="theme-color" content="#1f2d34">
<meta name="description" content="An interactive educational microbiology LIS for MLT students: specimen receipt, culture workup, critical-value reporting, and laboratory documentation. Fictitious patients only.">

<style>
/* Layout: LIS workstation. A dark system banner, a slim nav bar, then one working pane per screen.
   Clinical data (accessions, MRNs, times) in mono; everything else in serif. */
:root{
  --bg:#edf1f2; --surface:#ffffff; --sunk:#f5f8f9; --ink:#162229; --muted:#4f5f67; --line:#c9d3d7;
  --accent:#1b5a73; --accent-ink:#ffffff; --accent-soft:#dcebf1;
  --crit:#9e1f2a; --crit-bg:#fae8ea; --warn:#7a4f00; --warn-bg:#fbf0d8; --ok:#20603a; --ok-bg:#e2f1e7;
  --bar:#1f2d34; --bar-ink:#e6edf0; --bar-muted:#a9bac2;
  --label-bg:#ffffff; --label-ink:#000000; --label-line:#8a959a;
  --serif:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f161a; --surface:#172127; --sunk:#131b20; --ink:#e2e9ec; --muted:#9db0b8; --line:#2c3a42;
  --accent:#72b8d4; --accent-ink:#0b1a20; --accent-soft:#1b313b;
  --crit:#ff9aa2; --crit-bg:#3a181c; --warn:#f2c46a; --warn-bg:#33280f; --ok:#82d6a1; --ok-bg:#15301f;
  --bar:#080d10; --bar-ink:#d6e0e4; --bar-muted:#8ea1a9; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f161a; --surface:#172127; --sunk:#131b20; --ink:#e2e9ec; --muted:#9db0b8; --line:#2c3a42;
  --accent:#72b8d4; --accent-ink:#0b1a20; --accent-soft:#1b313b;
  --crit:#ff9aa2; --crit-bg:#3a181c; --warn:#f2c46a; --warn-bg:#33280f; --ok:#82d6a1; --ok-bg:#15301f;
  --bar:#080d10; --bar-ink:#d6e0e4; --bar-muted:#8ea1a9; color-scheme:dark }

*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--serif); font-size:15px; line-height:1.5}
.wrap{max-width:1180px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{text-wrap:balance; line-height:1.2; margin:0}
h1{font-size:1.6rem}
h2{font-size:1.2rem}
h3{font-size:1rem}
p{margin:0}
a{color:var(--accent)}
.mono,code{font-family:var(--mono); font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.skip{position:absolute; left:-999px}
.skip:focus{left:16px; top:8px; z-index:20; background:var(--surface); padding:6px 10px}

/* Top system bar */
.sys{background:var(--bar); color:var(--bar-ink)}
.sys .wrap{display:flex; flex-wrap:wrap; gap:8px 20px; align-items:center; justify-content:space-between; padding-block:10px}
.brand{display:flex; gap:12px; align-items:baseline; flex-wrap:wrap}
.brand strong{font-size:1.15rem; letter-spacing:.01em}
.brand span{font-family:var(--mono); font-size:.75rem; color:var(--bar-muted); text-transform:uppercase; letter-spacing:.08em}
.savestate{font-family:var(--mono); font-size:.8rem; display:flex; align-items:center; gap:8px; color:var(--bar-muted)}
.dot{width:9px; height:9px; border-radius:50%; background:var(--ok); display:inline-block}
.dot.bad{background:var(--crit)}
.warnband{background:var(--warn-bg); color:var(--warn); font-family:var(--mono); font-size:.78rem; letter-spacing:.04em}
.warnband .wrap{padding-block:5px}
nav.tabs{background:var(--surface); border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex; flex-wrap:wrap; gap:4px; align-items:center; padding-block:6px}
nav.tabs a{font-family:var(--mono); font-size:.85rem; text-decoration:none; color:var(--ink); padding:7px 12px; border-radius:var(--r)}
nav.tabs a:hover{background:var(--sunk)}
nav.tabs a[aria-current="page"]{background:var(--accent); color:var(--accent-ink)}
.techform{margin-left:auto; display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-family:var(--mono); font-size:.8rem}
.techform input{width:11rem}

main{padding-block:22px 48px}
.stack{display:flex; flex-direction:column; gap:18px}
.row{display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end}
.grid2{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:18px; align-items:start}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px; min-width:0}
.panel > h2, .panel > h3{margin-bottom:12px}
.lede{color:var(--muted); max-width:68ch}
.eyebrow{font-family:var(--mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted)}

/* Forms */
label{display:block; font-size:.9rem; font-weight:600}
.field{display:flex; flex-direction:column; gap:4px; min-width:0}
.field small{color:var(--muted); font-weight:400}
input,select,textarea{font:inherit; font-size:.95rem; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:7px 9px; max-width:100%}
input.mono, select.mono{font-family:var(--mono)}
textarea{width:100%; min-height:5rem}
fieldset{border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; margin:0; min-width:0}
legend{font-weight:600; padding:0 6px}
.checks{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:6px 16px}
.checks label{font-weight:400; display:flex; gap:8px; align-items:flex-start}
.checks input{margin-top:5px}
.formgrid{display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:12px 16px}
button{font:inherit; font-family:var(--mono); font-size:.85rem; cursor:pointer; border-radius:4px; padding:8px 14px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink)}
button.secondary{background:transparent; color:var(--accent)}
button.danger{background:transparent; color:var(--crit); border-color:var(--crit)}
button.small{padding:4px 9px; font-size:.78rem}
button:disabled{opacity:.5; cursor:not-allowed}
a.btnlink{display:inline-block; font-family:var(--mono); font-size:.85rem; text-decoration:none; border-radius:4px; padding:8px 14px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink)}

/* Messages */
.msg{border-radius:var(--r); padding:10px 14px; font-size:.95rem}
.msg:empty{display:none}
.msg.ok{background:var(--ok-bg); color:var(--ok)}
.msg.crit{background:var(--crit-bg); color:var(--crit)}
.msg.warn{background:var(--warn-bg); color:var(--warn)}
.msg.info{background:var(--accent-soft); color:var(--ink)}

/* Tables */
.tablewrap{overflow-x:auto; min-width:0}
table{border-collapse:collapse; width:100%; font-size:.92rem}
th,td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top}
th{font-family:var(--mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:500; white-space:nowrap}
td.mono{white-space:nowrap}
tbody tr:hover{background:var(--sunk)}

/* Pills */
.pill{display:inline-block; font-family:var(--mono); font-size:.72rem; letter-spacing:.04em; text-transform:uppercase; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); white-space:nowrap}
.pill.Received,.pill.In-culture{background:var(--accent-soft); color:var(--ink); border-color:transparent}
.pill.Preliminary{background:var(--warn-bg); color:var(--warn); border-color:transparent}
.pill.Final{background:var(--ok-bg); color:var(--ok); border-color:transparent}
.pill.Corrected{background:var(--warn-bg); color:var(--warn); border-color:var(--warn)}
.pill.Rejected,.pill.crit{background:var(--crit-bg); color:var(--crit); border-color:transparent}
.pill.stat{background:var(--crit); color:var(--surface); border-color:transparent}
.pill.ex{border-style:dashed}

/* Patient banner */
.pbanner{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px 18px; background:var(--sunk); border:1px solid var(--line); border-left:5px solid var(--accent); border-radius:var(--r); padding:14px 16px}
.pbanner .k{font-family:var(--mono); font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.pbanner .v{font-family:var(--mono); font-size:.95rem}
.pbanner .v.name{font-family:var(--serif); font-weight:700; font-size:1.1rem}

/* Specimen label: a physical 2 x 1 in label, white in either theme */
figure.labelfig{margin:0; display:flex; flex-direction:column; gap:8px}
.tube-label{width:min(100%, 22rem); aspect-ratio:2 / 1; background:var(--label-bg); color:var(--label-ink); border:1px dashed var(--label-line); border-radius:3px; display:flex; font-family:var(--mono); overflow:hidden}
.tube-label .statbar{writing-mode:vertical-rl; transform:rotate(180deg); background:var(--label-ink); color:var(--label-bg); font-weight:600; font-size:.8rem; letter-spacing:.2em; display:flex; align-items:center; justify-content:center; padding:0 3px}
.tube-label .lb{flex:1; padding:7px 10px; display:flex; flex-direction:column; justify-content:space-between; font-size:.74rem; line-height:1.25; min-width:0}
.tube-label .ln{font-weight:600; font-size:.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tube-label .la{font-size:1.15rem; font-weight:600; letter-spacing:.06em}
.tube-label .lr{display:flex; justify-content:space-between; gap:8px}
figcaption{font-size:.88rem; color:var(--muted); max-width:46ch}

/* Case sections */
.casehead{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center}
.casehead h1{font-family:var(--mono); font-size:1.5rem; letter-spacing:.03em}
.orgrow{display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end}
.orgrow .field{flex:1 1 220px}
.isolate{border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; display:flex; flex-direction:column; gap:10px; background:var(--sunk)}
.isohead{display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; align-items:baseline}
.loglist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.loglist li{border-left:3px solid var(--line); padding:2px 0 2px 12px}
.loglist .meta{font-family:var(--mono); font-size:.75rem; color:var(--muted)}
.critbox{border:2px solid var(--crit); background:var(--crit-bg); border-radius:var(--r); padding:14px 16px; display:flex; flex-direction:column; gap:10px}
.critbox h2{color:var(--crit)}

/* Report */
.report{background:var(--label-bg); color:var(--label-ink); border:1px solid var(--label-line); border-radius:3px; padding:18px 20px; font-size:.9rem; overflow-x:auto}
.report .rh{display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; border-bottom:2px solid var(--label-ink); padding-bottom:8px; margin-bottom:10px}
.report .status{font-family:var(--mono); font-weight:600; letter-spacing:.1em}
.report dl{display:grid; grid-template-columns:max-content 1fr; gap:2px 14px; margin:0 0 10px}
.report dt{font-family:var(--mono); font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; padding-top:2px}
.report dd{margin:0; font-family:var(--mono)}
.report h4{margin:12px 0 4px; font-size:.95rem; border-bottom:1px solid var(--label-line)}
.report table th,.report table td{border-color:var(--label-line); color:var(--label-ink)}
.report .corr{border:2px solid var(--label-ink); padding:8px 10px; margin-bottom:10px; font-weight:600}
details{border:1px solid var(--line); border-radius:var(--r); padding:8px 12px; background:var(--surface)}
details + details{margin-top:8px}
summary{cursor:pointer; font-family:var(--mono); font-size:.85rem}
details[open] summary{margin-bottom:10px}

/* Storage test */
.tiles{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; display:flex; flex-direction:column; gap:4px}
.tile .k{font-family:var(--mono); font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.tile .v{font-family:var(--mono); font-size:1.25rem; font-weight:600; font-variant-numeric:tabular-nums}
.tile .v.big{font-size:1.6rem; letter-spacing:.06em}
.tile.good{border-left:5px solid var(--ok)}
.tile.bad{border-left:5px solid var(--crit)}
ol.steps{margin:0; padding-left:1.3rem; display:flex; flex-direction:column; gap:6px; max-width:72ch}
/* Version 2: dashboard, workflow guidance and printable results */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}
.kpi{display:flex;flex-direction:column;gap:3px;padding:13px 15px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.kpi .k{font:500 .7rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .v{font:600 1.5rem var(--mono);font-variant-numeric:tabular-nums}
.kpi.urgent{border-left:4px solid var(--crit)}
.kpi.done{border-left:4px solid var(--ok)}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.toolbar .field{flex:1 1 170px}
.toolbar .field:first-child{flex:2 1 280px}
.toolbar button{height:37px}
.checklist{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:7px}
.step{border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;background:var(--surface);font-size:.83rem}
.step .num{font:.72rem var(--mono);color:var(--muted);display:block;margin-bottom:3px}
.step.done{border-color:var(--ok);background:var(--ok-bg)}
.step.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.step.locked{opacity:.67}
.step strong{display:block}
.helptext{color:var(--muted);font-size:.89rem;line-height:1.45}
.hint{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 13px;font-size:.91rem}
.callout{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface)}
.callout p+p{margin-top:8px}
.keycap{font-family:var(--mono);border:1px solid var(--line);padding:0 5px;border-radius:3px}
.tablewrap table{min-width:730px}
.theme-toggle{margin-left:6px}
#worklist-empty{padding:16px;text-align:center;color:var(--muted)}
@media(min-width:900px){nav.tabs .wrap{gap:6px}}
@media(max-width:620px){.techform{margin-left:0;flex:1 1 100%}.techform input{flex:1;width:10rem}.theme-toggle{margin-left:auto}.panel{padding:13px}.report{padding:13px}.brand span{font-size:.68rem}}
@media print{
  body{background:#fff!important;color:#000!important}
  body.printing header,body.printing #view,body.printing #flash,body.printing .skip{display:none!important}
  body.printing #print-area{display:block!important}
  body.printing main{padding:0!important;max-width:none!important}
  body.printing #print-area .report{border:0!important;padding:0!important;color:#000!important}
  body.printing #print-area .tube-label{margin:12px 0;width:2in;height:1in;aspect-ratio:auto}
  body.printing #print-area .tube-label .lb{padding:2px 3px;font-size:6pt;line-height:1.12}
  body.printing #print-area .tube-label .ln{font-size:7pt}
  body.printing #print-area .tube-label .la{font-size:9pt;letter-spacing:0}
  body.printing #print-area .tube-label .statbar{font-size:6pt}
  body.printing #print-area figcaption{display:none}
  body.printing #print-area .report table{min-width:0}
  @page{margin:14mm}
}


.biochem-panel{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.biochem-panel h4{font-size:1rem;margin:0}
.biochem-panel table{min-width:560px}
.isolate>form[data-form="update-isolate"]{padding:12px;border:1px dashed var(--line);border-radius:8px;background:var(--accent-soft)}


.mobile-rail-hint{display:none;font-size:.75rem;color:var(--muted);padding:0 5px;margin-top:-5px}
@media(max-width:800px){.mobile-rail-hint{display:block}}

/* v3 — course workstation UI: clear hierarchy and one bench station at a time. */
:root{--bg:#f1f5f8;--surface:#fff;--sunk:#f5f8fb;--ink:#172839;--muted:#526677;--line:#d5e0e8;--accent:#165a79;--accent-soft:#eaf4f9;--bar:#152b3a;--r:10px}
body{font-size:15px;line-height:1.52}
.wrap{max-width:1380px;padding-inline:max(24px,env(safe-area-inset-left,0px)) max(24px,env(safe-area-inset-right,0px))}
.sys .wrap{padding-block:13px}.brand{gap:16px;align-items:center}.brand strong{font-size:1.28rem;letter-spacing:-.04em}.brand span{font-size:.7rem}
.warnband{background:#e4eef3;color:#284a5d;font-size:.68rem;letter-spacing:.085em}
.warnband .wrap{padding-block:6px}
nav.tabs{position:sticky;top:0;z-index:12;box-shadow:0 2px 6px rgba(15,39,54,.05)}
nav.tabs .wrap{gap:5px;padding-block:8px}
nav.tabs a{font-family:var(--serif);font-size:.85rem;font-weight:650;padding:9px 13px}
nav.tabs a[aria-current="page"]{box-shadow:0 2px 5px rgba(10,54,74,.13)}
.techform{font-family:var(--serif);font-weight:600}
.techform input{min-height:37px}
main{padding-block:28px 64px}.stack{gap:17px}
h1{font-size:clamp(1.6rem,2.4vw,2rem);letter-spacing:-.035em}h2{letter-spacing:-.02em}
.panel{padding:23px;border-radius:10px;box-shadow:0 2px 12px rgba(18,43,59,.025)}
.lede{max-width:76ch;line-height:1.58}
.eyebrow{font-size:.69rem;letter-spacing:.095em;font-weight:650}
button,a.btnlink{font-family:var(--serif);font-weight:650;border-radius:7px;padding:9px 14px;min-height:38px;font-size:.86rem}
button:hover:not(:disabled),a.btnlink:hover{filter:brightness(.92)}
input,select,textarea{min-height:39px;border-color:#bdcdd7;border-radius:7px;padding:9px 11px}
input[type="checkbox"]{min-height:0;accent-color:var(--accent)}
button.secondary{background:var(--surface)}button.small{padding:6px 10px;min-height:30px;font-size:.8rem}
label{font-size:.86rem}.field small{display:block;line-height:1.3;margin-top:1px}
.pill{font-size:.7rem;font-weight:600;letter-spacing:.025em;padding:3px 8px}
.kpi{padding:16px 17px;gap:6px;box-shadow:0 1px 5px rgba(18,43,59,.03)}.kpi .v{font-family:var(--serif);font-size:1.9rem;line-height:1.1;letter-spacing:-.04em}
.kpi .k{font-family:var(--serif);font-weight:700;letter-spacing:.02em;font-size:.7rem}
.kpis{gap:12px}
.tablewrap table{min-width:740px}
th{font-size:.68rem;letter-spacing:.06em} td{padding:13px 10px}tbody tr:hover{background:var(--accent-soft)}
a.row-open{text-decoration:none;font-weight:700;white-space:nowrap}a.row-open:hover{text-decoration:underline}
.lab-path{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.lab-path>div{border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:var(--surface);font-size:.81rem;color:var(--muted)}
.lab-path b{color:var(--ink);display:block;font-size:.84rem;margin-bottom:3px}
.lab-path .path-number{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:750;margin-right:6px}
.case-page{gap:18px}
.case-top{display:flex;flex-wrap:wrap;gap:10px 15px;align-items:center;justify-content:space-between}
.case-top .actionrow{display:flex;flex-wrap:wrap;align-items:center;gap:9px}
.casehead h1{font-size:1.75rem}
.pbanner{grid-template-columns:repeat(4,minmax(0,1fr));padding:15px 20px;border-left-width:4px;gap:14px 18px}
.pbanner .v{font-size:.9rem;overflow-wrap:anywhere}.pbanner .v.name{font-size:1.02rem}
.case-shell{display:grid;grid-template-columns:235px minmax(0,1fr);align-items:start;gap:20px}
.case-rail{position:sticky;top:77px;display:flex;flex-direction:column;gap:12px;min-width:0}
.rail-nav{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 13px rgba(20,47,63,.035)}
.rail-header{padding:7px 10px 11px;border-bottom:1px solid var(--line);margin-bottom:5px}
.rail-header .eyebrow{display:block;margin-bottom:5px}
.rail-header strong{display:block;font-size:.93rem}
.station-btn{display:flex;gap:10px;align-items:center;text-align:left;width:100%;border:1px solid transparent;background:transparent;color:var(--ink);padding:10px 9px;font-size:.86rem;min-height:46px;font-family:var(--serif);font-weight:600;box-shadow:none}
.station-btn:hover{background:var(--sunk)}.station-btn[aria-current="step"]{border-color:#c4e0eb;background:var(--accent-soft);color:var(--accent)}
.station-btn .station-n{width:25px;height:25px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;flex:none;font-family:var(--mono);font-size:.73rem;color:var(--muted);background:var(--surface)}
.station-btn .station-n.complete{background:var(--ok-bg);color:var(--ok);border-color:transparent}

<script>
(function(){
"use strict";
document.documentElement.lang = "en";

/* ---------- constants ---------- */
const APP = "mlt-sim-lis-micro";
const DKEY = "mltlis.preview.device";
const SKEY = "mltlis.preview.micro.v1";
const SSKEY = "mltlis.preview.sessionloads";
const THEMEKEY = "mltlis.preview.theme";
const LAB = { name: "MLT Student Microbiology Laboratory (simulated)", addr: "Northwood Technical College, New Richmond campus, New Richmond, WI" };

const CULTURES = {
  "Blood culture":  { source: "Blood",  media: ["Aerobic blood culture bottle","Anaerobic blood culture bottle"], critical: true,  qty: "semi" },
  "Urine culture":  { source: "Urine",  media: ["BAP","MAC"], critical: false, qty: "urine" },
  "Wound culture":  { source: "Wound",  media: ["BAP","CHOC","MAC","CNA","Thioglycolate broth"], critical: false, qty: "semi" },
  "Throat culture": { source: "Throat", media: ["BAP"], critical: false, qty: "semi" },
  "Sputum culture": { source: "Sputum", media: ["BAP","CHOC","MAC"], critical: false, qty: "semi" },
  "CSF culture":    { source: "CSF",    media: ["BAP","CHOC","Thioglycolate broth"], critical: true, qty: "semi" },
  "Stool culture":  { source: "Stool",  media: ["BAP","MAC","HE","CAMPY"], critical: false, qty: "semi" }
};
const MEDIA = ["Aerobic blood culture bottle","Anaerobic blood culture bottle","BAP","CHOC","MAC","CNA","HE","XLD","CAMPY","SAB","Thioglycolate broth"];
const QTY = {
  urine: ["<10,000 CFU/mL","10,000–49,000 CFU/mL","50,000–99,000 CFU/mL","≥100,000 CFU/mL"],
  semi:  ["Rare","Few","Moderate","Many","Isolated from blood culture bottle","Growth in broth only"]
};
const ID_METHODS = ["Pending identification","MALDI-TOF MS","Automated ID system","Commercial kit","Conventional biochemicals","Rapid tests"];
const BIOCHEM = ["Catalase","Slide coagulase","Tube coagulase","Oxidase","PYR","Bile esculin","Growth in 6.5% NaCl","CAMP","Bacitracin","Optochin","Indole","Methyl red","Voges-Proskauer","Citrate","Urease","Motility","Hydrogen sulfide (H2S)","Lysine decarboxylase","Ornithine decarboxylase","Phenylalanine deaminase","Lactose fermentation","Glucose fermentation","Gas production","Nitrate reduction","ONPG","TSI slant / butt","Other"];
const CELLS = ["None seen","Rare","Few","Moderate","Many"];
const MORPH = ["Gram-positive cocci in clusters","Gram-positive cocci in chains","Gram-positive cocci in pairs","Gram-positive bacilli","Gram-negative bacilli","Gram-negative coccobacilli","Gram-negative diplococci","Yeast","Mixed bacterial morphotypes"];
const ORGQ = ["Rare","Few","Moderate","Many"];
const DRUGS = ["Ampicillin","Ampicillin-sulbactam","Cefazolin","Ceftriaxone","Cefepime","Ciprofloxacin","Levofloxacin","Gentamicin","Nitrofurantoin","Trimethoprim-sulfamethoxazole","Oxacillin","Penicillin","Vancomycin","Clindamycin","Erythromycin","Tetracycline","Meropenem","Piperacillin-tazobactam"];
const REJECT = ["Unlabeled specimen","Mislabeled / identifiers do not match order","Collection date/time missing","Collector ID missing","Wrong container or transport medium","Leaking or broken container","Transport time exceeded","Quantity not sufficient","Specimen unsuitable for culture requested","Duplicate order"];
const CREDS = ["RN","MD","DO","PA","NP","Other licensed caregiver"];
const PROVIDERS = ["A. Lindqvist, MD (Hospitalist)","R. Castellano, DO (Emergency)","K. Moua, NP (Clinic)","S. Petrakis, MD (ICU)","J. Whitebird, PA (Women's Health)"];

/* ---------- helpers ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
function fmt(iso){ if(!iso) return "—"; const d = new Date(iso); if(isNaN(d)) return "—"; return `${pad(d.getMonth()+1)}/${pad(d.getDate())}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtDate(ymd){ if(!ymd) return "—"; const [y,m,d] = ymd.split("-"); return `${m}/${d}/${y}`; }
function withinDateBounds(value, earliest){
  const time = new Date(value).getTime();
  if(!Number.isFinite(time)) return false;
  return (!earliest || time >= new Date(earliest).getTime()) && time <= Date.now()+5*60000;
}
function safeReportHTML(html){
  // Reports stored in a save file are untrusted. Only a small formatting whitelist is rendered.
  const doc = new DOMParser().parseFromString(String(html || ""), "text/html");
  const tags = new Set(["div","p","strong","em","br","dl","dt","dd","h4","table","thead","tbody","tr","th","td"]);
  const classes = new Set(["report","rh","status","corr","tablewrap","mono"]);
  const discard = new Set(["script","style","iframe","svg","math","object","embed","form","input","button","link","meta","template"]);
  const walk = node => {
    if(node.nodeType===Node.TEXT_NODE) return esc(node.nodeValue);
    if(node.nodeType!==Node.ELEMENT_NODE) return "";
    const tag=node.tagName.toLowerCase();
    if(discard.has(tag)) return "";
    const body=Array.from(node.childNodes,walk).join("");
    if(!tags.has(tag)) return body;
    if(tag==="br") return "<br>";
    const cls=Array.from(node.classList).filter(c=>classes.has(c)).join(" ");
    return `<${tag}${cls ? ` class="${cls}"` : ""}>${body}</${tag}>`;
  };
  return Array.from(doc.body.childNodes,walk).join("");
}
function validState(s){
  if(!s || s.app!==APP || !Array.isArray(s.patients) || !Array.isArray(s.accessions) || !Array.isArray(s.audit) || !Number.isSafeInteger(s.seq) || s.seq<1) return false;
  if(!s.patients.every(p=>p && /^[A-Za-z0-9_-]{1,20}$/.test(p.id) && typeof p.last==="string" && typeof p.first==="string" && /^\d{4,12}$/.test(p.mrn) && /^\d{4}-\d{2}-\d{2}$/.test(p.dob))) return false;
  const ids=new Set(s.patients.map(p=>p.id));
  const accs=new Set();
  for(const a of s.accessions){
    if(!a || typeof a.acc!=="string" || !/^M\d{7}[A-Z]$/.test(a.acc) || checkChar(a.acc.slice(0,8))!==a.acc[8] || accs.has(a.acc) || !ids.has(a.pid) || !Object.prototype.hasOwnProperty.call(CULTURES,a.culture) || !Array.isArray(a.reads) || !Array.isArray(a.isolates) || !Array.isArray(a.calls) || !Array.isArray(a.reports) || !a.flags || ![null,true,false].includes(a.receipt?.ok ?? null)) return false;
    accs.add(a.acc);
    if(a.isolates.some(i=>!i || !Array.isArray(i.ast) || (i.tests!==undefined && (!Array.isArray(i.tests) || i.tests.some(t=>!t || typeof t.test!=="string" || typeof t.result!=="string" || typeof t.note!=="string"))))) return false;
    if(a.reports.some(r=>!r || typeof r.html!=="string" || !Number.isSafeInteger(r.version) || r.version<1 || !["Preliminary","Final","Corrected"].includes(r.type))) return false;
  }
  return s.audit.every(e=>e && typeof e.action==="string" && typeof e.by==="string" && typeof e.detail==="string" && typeof e.at==="string" && (e.acc==="" || (typeof e.acc==="string" && accs.has(e.acc))));
}
function nowISO(){ return new Date().toISOString(); }
function localInputNow(offsetMin){ const d = new Date(Date.now() + (offsetMin||0)*60000); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function fromLocalInput(v){ const d = new Date(v); return isNaN(d) ? null : d.toISOString(); }
const opts = (arr, sel) => arr.map(v => `<option${v===sel?" selected":""}>${esc(v)}</option>`).join("");
const $ = sel => document.querySelector(sel);

/* ---------- storage layer ---------- */
function lsGet(k){ try { return window.localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { window.localStorage.setItem(k,v); return true; } catch(e){ return false; } }
function lsDel(k){ try { window.localStorage.removeItem(k); } catch(e){} }
function storageWorks(){ try { localStorage.setItem("mltlis.preview.probe","1"); const ok = localStorage.getItem("mltlis.preview.probe")==="1"; localStorage.removeItem("mltlis.preview.probe"); return ok; } catch(e){ return false; } }

const ID_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function randomCode(n){ let s=""; const a = new Uint32Array(n); window.crypto.getRandomValues(a); for(const v of a) s += ID_CHARS[v % ID_CHARS.length]; return s; }

const env = { storageOK:false, device:null, deviceIsNew:false, sessionLoads:0, lastSaveOK:false, lastSaveAt:null, seededThisLoad:false, framed:false, persisted:null };
try { env.framed = window.self !== window.top; } catch(e){ env.framed = true; }

function initDevice(){
  env.storageOK = storageWorks();
  let d = null; try { d = JSON.parse(lsGet(DKEY)); } catch(e){}
  if(!d || !d.id){ d = { id: randomCode(4)+"-"+randomCode(4), firstSeen: nowISO(), loads: 0 }; env.deviceIsNew = true; }
  d.loads = (d.loads||0) + 1;
  lsSet(DKEY, JSON.stringify(d));
  env.device = d;
  let sl = 0; try { sl = parseInt(sessionStorage.getItem(SSKEY)||"0",10)+1; sessionStorage.setItem(SSKEY,String(sl)); } catch(e){ sl = 1; }
  env.sessionLoads = sl;
  if(navigator.storage && navigator.storage.persisted){ navigator.storage.persisted().then(p => { env.persisted = p; if(route().name==="storage") render(); }).catch(()=>{}); }
}

/* ---------- state ---------- */
let S = null;
function save(){
  S.savedAt = nowISO();
  env.lastSaveOK = lsSet(SKEY, JSON.stringify(S));
  env.lastSaveAt = S.savedAt;
  paintSaveState();
}
function load(){
  const raw = lsGet(SKEY);
  if(raw){ try { S = JSON.parse(raw); } catch(e){ S = null; } }
  if(!validState(S)){ S = seed(); env.seededThisLoad = true; save(); }
  else { env.lastSaveOK = env.storageOK; env.lastSaveAt = S.savedAt; }
}
function audit(acc, action, detail){ S.audit.push({ at: nowISO(), by: S.tech || "(not signed in)", acc: acc||"", action, detail: detail||"" }); }

/* accession numbers: M + 2-digit year + 5-digit sequence + check letter */
const CHECK = "ABCDEFGHJKLMNPRSTUVWXYZ";
function checkChar(core){ let sum=0; for(let i=0;i<core.length;i++) sum += core.charCodeAt(i) * (i+1); return CHECK[sum % CHECK.length]; }
function newAccession(){ const yy = String(new Date().getFullYear()).slice(2); const core = "M"+yy+String(S.seq).padStart(5,"0"); S.seq++; return core + checkChar(core); }
const normAcc = s => String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const showAcc = a => a.length===9 ? `${a.slice(0,3)}-${a.slice(3,8)}-${a.slice(8)}` : a;
function lookupAcc(input){
  const n = normAcc(input);
  if(!/^M\d{7}[A-Z]$/.test(n)) return { err: "That is not an accession number. Accessions look like M26-00001-T: the letter M, seven digits, and a check letter (illustrative 2026 accession)." };
  if(checkChar(n.slice(0,8)) !== n[8]) return { err: "The check letter does not match. One or more characters were copied or typed wrong. Re-read the tube label." };
  const a = S.accessions.find(x => x.acc === n);
  if(!a) return { err: `No order exists for ${showAcc(n)}.` };
  return { a };
}

function seed(){
  const now = Date.now(), H = 3600000;
  const iso = ms => new Date(ms).toISOString();
  const s = { app: APP, created: nowISO(), tech: "", seq: 1, patients: [
      { id:"P1", last:"HALVORSEN", first:"Ingrid", mi:"M", mrn:"300418", dob:"1951-03-14", sex:"F", loc:"3 West 312" },
      { id:"P2", last:"JOHNSON", first:"Eric", mi:"T", mrn:"300552", dob:"1988-07-02", sex:"M", loc:"ED 4" },
      { id:"P3", last:"JOHNSEN", first:"Erik", mi:"T", mrn:"301207", dob:"1988-07-20", sex:"M", loc:"Family Medicine Clinic" },
      { id:"P4", last:"OKAFOR", first:"Grace", mi:"A", mrn:"300974", dob:"2003-11-09", sex:"F", loc:"Women's Health Clinic" },
      { id:"P5", last:"BRUNNER", first:"Walter", mi:"J", mrn:"301355", dob:"1946-01-28", sex:"M", loc:"ICU 2" },
      { id:"P6", last:"VUE", first:"Mai Nou", mi:"", mrn:"301480", dob:"1979-05-17", sex:"F", loc:"4 East 418" }
    ], accessions: [], audit: [] };
  S = s;
  // Example 1: blood culture already received and incubating; Gram stain is the student's task
  const a1 = blankAcc(newAccession(), "P5", "Blood culture", "R antecubital venipuncture, set 1 of 2", "STAT", PROVIDERS[3], iso(now-20*H), "JRS");
  a1.example = true; a1.orderedAt = iso(now-20.5*H); a1.orderedBy = "Example";
  a1.receipt = { at: iso(now-19.8*H), by: "Example", ok: true };
  a1.media = { list: ["Aerobic blood culture bottle","Anaerobic blood culture bottle"], notes: "Loaded on continuous-monitoring instrument", at: iso(now-19.7*H), by: "Example" };
  a1.reads.push({ day: 1, note: "Aerobic bottle flagged positive at 18.2 h. Anaerobic bottle negative to date. Gram stain of aerobic bottle pending.", at: iso(now-1*H), by: "Example" });
  // Example 2: urine culture ordered but not yet received; receipt is the student's task
  const a2 = blankAcc(newAccession(), "P4", "Urine culture", "Clean-catch midstream", "Routine", PROVIDERS[4], iso(now-1.2*H), "KLM");
  a2.example = true; a2.orderedAt = iso(now-1.5*H); a2.orderedBy = "Example";
  s.accessions.push(a1, a2);
  s.audit.push({ at: a1.orderedAt, by:"Example", acc:a1.acc, action:"Order placed", detail:"Blood culture, STAT" });
  s.audit.push({ at: a1.receipt.at, by:"Example", acc:a1.acc, action:"Specimen accepted", detail:"" });
  s.audit.push({ at: a2.orderedAt, by:"Example", acc:a2.acc, action:"Order placed", detail:"Urine culture, Routine" });
  return s;
}
function blankAcc(acc, pid, culture, site, priority, provider, collected, collector){
  return { acc, pid, culture, source: CULTURES[culture].source, site, priority, provider, collected, collector,
    orderedAt: nowISO(), orderedBy: S.tech, receipt: null, media: null, gram: null, reads: [], isolates: [],
    flags: { ip:false, ph:false, note:"" }, calls: [], stmt: "", reports: [], example: false };
}
const patient = id => S.patients.find(p => p.id === id) || {};
const pname = p => `${p.last}, ${p.first}${p.mi ? " "+p.mi : ""}`;

function status(a){
  if(a.receipt && !a.receipt.ok) return "Rejected";
  if(!a.receipt) return "Ordered";
  const last = a.reports[a.reports.length-1];
  if(last) return last.type;
  if(a.media) return "In culture";
  return "Received";
}
function nextStep(a){
  const st=status(a);
  if(criticalDue(a)) return "Document critical call";
  if(st==="Rejected") return "Recollection requested";
  if(st==="Final" || st==="Corrected") return "Review released report";
  if(!a.receipt) return "Receive specimen";
  if(!a.media) return "Set up culture";
  if(a.culture==="Blood culture" && !a.gram) return "Record Gram stain";
  if(!a.reads.length && !a.isolates.length) return "Record plate read";
  if(!a.isolates.length && !a.stmt) return "Identify isolate";
  if(st==="Preliminary") return "Continue workup";
  return "Review and release";
}
function criticalRequired(a){ return !!(CULTURES[a.culture].critical && a.gram && a.gram.orgs.length); }
function validCall(c){ return !!(c && c.readback && String(c.name||"").trim().split(/\s+/).length>=2 && String(c.where||"").trim() && String(c.result||"").trim() && Number.isFinite(Date.parse(c.at))); }
function criticalDue(a){
  if(!criticalRequired(a)) return false;
  return !a.calls.some(c => validCall(c) && c.recorded >= a.gram.at);
}

/* ---------- routing ---------- */
function route(){
  const h = (location.hash||"").replace(/^#/,"");
  if(h.startsWith("case-")) return { name:"case", acc: normAcc(h.slice(5)) };
  if(["worklist","order","receive","audit","storage","guide"].includes(h)) return { name:h };
  return { name:"worklist" };
}
let ui = { lastCreated: null, receiveAcc: null, auditFilter: "", importPending: null, focusMain: false, caseTab: null, caseAcc: null, caseDirty: false };

/* ---------- top chrome ---------- */
function paintSaveState(){
  const el = $("#savestate"); if(!el) return;
  if(env.lastSaveOK) el.innerHTML = `<span class="dot" aria-hidden="true"></span>Saved in this browser ${env.lastSaveAt ? fmt(env.lastSaveAt).slice(11) : ""}`;
  else el.innerHTML = `<span class="dot bad" aria-hidden="true"></span>Not saving in this browser. Use a save code.`;
}
function paintNav(r){
  const themeBtn = $("#theme-toggle");
  if(themeBtn){ const dark = document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches); themeBtn.textContent = dark ? "Light mode" : "Dark mode"; themeBtn.setAttribute("aria-pressed",String(dark)); }
  document.querySelectorAll("nav.tabs a").forEach(a => {
    if(a.dataset.route === r.name || (r.name==="case" && a.dataset.route==="worklist")) a.setAttribute("aria-current","page");
    else a.removeAttribute("aria-current");
  });
  const t = $("#techname"); if(t && document.activeElement !== t) t.value = S.tech || "";
}
function flash(text, kind){ const f = $("#flash"); f.className = "msg " + (kind||"info"); f.textContent = text || ""; }
function needTech(){
  if(S.tech) return false;

function filterWorklist(){
  const input=$("#wl-search"), status=$("#wl-status"), priority=$("#wl-priority");
  if(!input || !status || !priority) return;
  const q=input.value.toLowerCase().replace(/[^a-z0-9]+/g,""), st=status.value, pri=priority.value;
  let shown=0;
  const rows=[...document.querySelectorAll("[data-worklist-row]")];
  for(const tr of rows){
    const content=tr.textContent.toLowerCase().replace(/[^a-z0-9]+/g,"");
    const ok=(!q || content.includes(q)) && (!st || tr.dataset.status===st) && (!pri || tr.dataset.priority===pri);
    tr.hidden=!ok; if(ok) shown++;
  }
  $("#wl-count").textContent=`Showing ${shown} of ${rows.length} accessions`;
  const empty=$("#worklist-empty"); if(empty) empty.hidden=shown>0 || rows.length===0;
}

const CASE_STATIONS = [
  ["overview","Case overview","Review the specimen, verify your assigned task, and check workflow progress."],
  ["specimen","Specimen & receipt","Check identifiers and collection details before accepting the specimen."],
  ["setup","Culture setup","Select the media or bottles inoculated and record incubation conditions."],
  ["microscopy","Gram stain","Document cellular findings and organism morphologies from your lab observation."],
  ["culture","Plate readings","Record each day’s observations on the media you actually examined."],
  ["identification","Identification & AST","Enter isolates and susceptibility measurements from your bench testing."],
  ["report","Report & release","Review notifications, report readiness, and the released result history."]
];
function suggestedStation(a){
  if(!a.receipt || !a.receipt.ok) return "specimen";
  if(criticalDue(a)) return "report";
  if(!a.media) return "setup";
  if(!a.gram && a.culture==="Blood culture") return "microscopy";
  if(!a.reads.length) return "culture";
  if(!a.isolates.length && !a.stmt) return "identification";
  return "report";
}
function tabProps(id){return `data-case-section="${id}"${ui.caseTab===id ? "" : " hidden"}`;}
function caseStationState(a){return {
  overview: true,
  specimen: !!(a.receipt && a.receipt.ok),
  setup: !!a.media,
  microscopy: !!a.gram,
  culture: !!a.reads.length,
  identification: !!a.isolates.length,
  report: !!a.reports.length
};}
function caseReadiness(a){return [
  ["Specimen accepted",!!(a.receipt && a.receipt.ok)],
  ["Culture setup saved",!!a.media],
  ["Plate read or isolate recorded",!!(a.reads.length || a.isolates.length)],
  ["Culture interpretation entered",!!(a.stmt && a.stmt.trim()) || !!a.isolates.length],
  ["Isolates identified (if present)",a.isolates.every(i=>i.method!=="Pending identification" && !/^unknown\b/i.test(i.name))],
  ["Critical communication complete",!criticalDue(a)]
];}
function benchSummaryText(a){
  const p=patient(a.pid);
  const lines=["CLINICAL MICROBIOLOGY — STUDENT BENCH SUMMARY", "EDUCATIONAL SIMULATION ONLY — FICTITIOUS PATIENT", "", `Technologist: ${S.tech || "(not signed in)"}`, `Case: ${showAcc(a.acc)} | ${a.culture} | ${status(a)}`, `Patient: ${pname(p)} | MRN ${p.mrn} | DOB ${fmtDate(p.dob)}`, `Source/site: ${a.source} — ${a.site}`, `Collected: ${fmt(a.collected)} | Received: ${a.receipt ? fmt(a.receipt.at) : "Pending"}`, "", "SPECIMEN / SETUP", a.receipt ? `${a.receipt.ok ? "Accepted" : "Rejected"} by ${a.receipt.by}${a.receipt.reason ? " — "+a.receipt.reason : ""}` : "Receipt pending", a.media ? `Media: ${a.media.list.join(", ")}; ${a.media.notes || "No incubation note"}` : "Media not entered", "", "GRAM STAIN", a.gram ? `PMNs: ${a.gram.pmn}; SEC: ${a.gram.epi}; Organisms: ${a.gram.orgs.length ? a.gram.orgs.map(o=>o.qty+" "+o.morph).join("; ") : "None seen"}` : "Not entered", "", "CULTURE READS", ...(!a.reads.length ? ["No reads entered"] : a.reads.map(r=>`Day ${r.day}: ${r.medium ? r.medium+" — " : ""}${r.growth ? r.growth+"; " : ""}${r.hemolysis && r.hemolysis!=="Not assessed" ? "Hemolysis "+r.hemolysis+"; " : ""}${r.note || "(No descriptive note)"}`)), "", "ISOLATES / SUSCEPTIBILITY"];
  if(!a.isolates.length) lines.push("No isolates entered");
  a.isolates.forEach((i,ix)=>{lines.push(`${ix+1}. ${i.name} — ${i.qty}; ID: ${i.method}`);(i.tests||[]).forEach(t=>lines.push(`   ID TEST ${t.test}: ${t.result}${t.note ? "; "+t.note : ""}`));i.ast.forEach(r=>lines.push(`   AST ${r.drug}: ${r.value} ${r.unit}; ${r.interp}; ${r.report ? "Reported" : "Suppressed"}`));});
  lines.push("", "CULTURE INTERPRETATION", a.stmt || "Not entered", "", "CRITICAL COMMUNICATION", ...(!a.calls.length ? ["None logged"] : a.calls.map(c=>`${fmt(c.at)} — ${c.name}, ${c.cred}, ${c.where}; read-back ${c.readback ? "yes" : "no"}`)), "", "RELEASED REPORTS", ...(!a.reports.length ? ["None"] : a.reports.map(r=>`Version ${r.version}: ${r.type} — ${fmt(r.at)} — ${r.by}`)), "", "This summary records student-entered evidence; it does not indicate competency or scientific correctness.");
  return lines.join("\n");
}
function benchSummaryHTML(a){return `<div class="report"><h2>Student bench summary</h2><p><strong>Educational simulation · fictitious patient</strong></p><div style="white-space:pre-wrap;font:11px/1.5 ui-monospace,Consolas,monospace;margin-top:16px">${esc(benchSummaryText(a))}</div></div>`;}

      <form class="orgrow" data-form="ast" data-ix="${ix}" aria-label="Add susceptibility result for isolate ${ix+1}">
        <div class="field"><label for="ad-${ix}">Drug</label><input id="ad-${ix}" name="drug" list="druglist" required></div>

        <label style="font-weight:400;display:flex;gap:6px;align-items:center;padding-bottom:8px"><input type="checkbox" name="report" checked> Report</label>
        <button type="submit" class="secondary">Add result</button>
      </form>
      <div class="biochem-panel">

  const calls = a.calls.map(c => `<li><div><strong>${esc(c.name)}, ${esc(c.cred)}</strong> · ${esc(c.where)} · read-back ${c.readback ? "confirmed" : "<strong>not obtained</strong>"}${validCall(c) ? "" : " · <strong>does not meet policy</strong>"}</div>

  const hasFinal = a.reports.some(r => r.type === "Final");
  const stage=CASE_STATIONS.find(x=>x[0]===ui.caseTab)||CASE_STATIONS[0];

      ${a.priority==="STAT" ? '<span class="pill stat">STAT</span>' : ""}${a.example ? '<span class="pill ex">Example</span>' : ""}

    <div class="pbanner" aria-label="Patient and specimen">
      <div><div class="k">Patient</div><div class="v name">${esc(pname(p))}</div></div>
      <div><div class="k">MRN</div><div class="v">${esc(p.mrn)}</div></div>
      <div><div class="k">DOB / sex</div><div class="v">${fmtDate(p.dob)} · ${esc(p.sex)}</div></div>
      <div><div class="k">Location</div><div class="v">${esc(p.loc)}</div></div>
      <div><div class="k">Culture / source</div><div class="v">${esc(a.culture)} · ${esc(a.source)}</div></div>
      <div><div class="k">Site</div><div class="v">${esc(a.site)}</div></div>
      <div><div class="k">Collected</div><div class="v">${fmt(a.collected)} · ${esc(a.collector)}</div></div>
      <div><div class="k">Received</div><div class="v">${a.receipt ? fmt(a.receipt.at) : "Not received"}</div></div>
      <div><div class="k">Ordering provider</div><div class="v">${esc(a.provider)}</div></div>
    </div>

    <div class="case-shell">
      <aside class="case-rail" aria-label="Accession workstations">
        <nav class="rail-nav" aria-label="Laboratory workstations">
          <div class="rail-header"><span class="eyebrow">CASE WORKSPACE</span><strong>${showAcc(a.acc)}</strong></div>
          ${CASE_STATIONS.map((s,i)=>`<button type="button" class="station-btn" data-act="case-tab" data-tab="${s[0]}" ${ui.caseTab===s[0] ? 'aria-current="step"' : ''}><span class="station-n ${done[s[0]] ? "complete" : ""}">${done[s[0]] ? "✓" : i+1}</span><span class="station-label">${esc(s[1])}</span>${done[s[0]] && s[0]!=="overview" ? '<span class="station-flag">Done</span>' : ""}</button>`).join("")}
        </nav>
        <p class="mobile-rail-hint">Swipe the station menu to access the other workflow steps →</p>
        <div class="rail-note"><strong>Simulation lab</strong>Save the form in each station before moving on. Submit the bench summary as directed by your instructor.</div>
      </aside>
      <div class="case-stage">
        <div class="station-heading"><div><span class="eyebrow">STATION ${stageIndex+1} / ${CASE_STATIONS.length}</span><h2>${esc(stage[1])}</h2><p>${esc(stage[2])}</p></div><span class="station-count">${done[stage[0]] ? "RECORDED" : "IN PROGRESS"}</span></div>
        <section class="station-intro" ${tabProps("specimen")} aria-label="Specimen verification">
          <h3>Specimen verification</h3><p>Use the accession number and patient identifiers to compare the order to the simulated tube. A completed order is not the same as specimen acceptance.</p>
          ${labelHTML(a)}
          <div class="worksheet-actions"><button type="button" data-act="go-receive" ${a.receipt ? "disabled" : ""}>${a.receipt ? (a.receipt.ok ? "Specimen accepted" : "Specimen rejected") : "Open specimen receipt"}</button><button type="button" class="secondary" data-act="print-label">Print label</button></div>
          ${a.receipt ? `<p class="helptext">Disposition: ${a.receipt.ok ? "Accepted" : "Rejected"} ${fmt(a.receipt.at)} by ${esc(a.receipt.by)}${a.receipt.reason ? ". Reason: "+esc(a.receipt.reason) : ""}</p>` : ""}
        </section>

    <section class="panel stack" ${tabProps("overview")} aria-label="Workflow progress">
      <div class="row" style="justify-content:space-between;align-items:center"><h2>Workflow progress</h2><span class="pill ${st.replace(" ","-")}">${esc(st)}</span></div>
      <div class="checklist">
        ${[
          ["Order placed",true],
          ["Specimen accepted",!!received],
          ["Culture setup",!!a.media],
          ["Microscopy / reads",!!a.gram || !!a.reads.length],
          ["Result documented",!!a.isolates.length || !!a.stmt],
          ["Report released",a.reports.length>0]
        ].map(([name,done],ix,all)=>`<div class="step ${done ? "done" : all.slice(0,ix).every(v=>v[1]) ? "active":"locked"}"><span class="num">STEP ${ix+1} ${done ? "✓" : ""}</span><strong>${name}</strong></div>`).join("")}
      </div>
      <p class="helptext">${rejected ? "Specimen rejected. Workup cannot proceed." : criticalDue(a) ? "Critical result communication is required before report release." : !received ? "Receive and verify the specimen before performing the workup." : "Document your actual laboratory findings. Use the culture report to communicate results, not only the bench notes."}</p>
    </section>
    <section class="station-intro" ${tabProps("overview")} aria-label="Next action and student submission"><h3>Next action: ${esc(nextStep(a))}</h3>
      <p>Work through the station menu in the order assigned by your instructor. Do not enter results that were not observed. The record is saved only in this browser until you export it.</p>
      <div class="worksheet-actions"><button type="button" data-act="case-tab" data-tab="${suggestedStation(a)}">Go to recommended station</button><button type="button" class="secondary" data-act="download-bench">Download current bench summary</button></div></section>
    ${!a.receipt ? `<div class="msg warn">This specimen has not been received. Workup opens after it is accepted on the <a href="#receive">Specimen receipt</a> screen.</div>` : ""}
    ${rejected ? `<div class="msg crit">Rejected ${fmt(a.receipt.at)} by ${esc(a.receipt.by)}: ${esc(a.receipt.reason)}. ${esc(a.receipt.note)}</div>` : ""}

    ${criticalRequired(a) ? `<section class="critbox" ${tabProps("report")} aria-labelledby="crith">
      <h2 id="crith">Critical result: organisms seen in a ${esc(a.source)} specimen</h2>
      <p>Notify the caregiver immediately, ask for a read-back, and document the call before releasing any report. Record the person's full name. A first name alone does not meet policy.</p>
      ${calls ? `<ul class="loglist">${calls}</ul>` : ""}
      <form class="stack" data-form="call">
        <div class="formgrid">
          <div class="field"><label for="cl-n">Caregiver full name</label><input id="cl-n" name="name" required placeholder="First and last name"></div>
          <div class="field"><label for="cl-c">Credential</label><select id="cl-c" name="cred">${opts(CREDS)}</select></div>
          <div class="field"><label for="cl-w">Unit or callback number</label><input id="cl-w" name="where" required value="${esc(p.loc)}"></div>
          <div class="field"><label for="cl-t">Time of call</label><input id="cl-t" name="at" type="datetime-local" class="mono" value="${localInputNow(0)}" required></div>

        <div class="field"><label for="cl-r">Result communicated</label><input id="cl-r" name="result" required value="${esc(a.culture)}, ${esc(a.source)}: ${esc(a.gram.orgs.map(o => o.qty+" "+o.morph.toLowerCase()).join("; "))}"></div>
        <label style="font-weight:400;display:flex;gap:8px"><input type="checkbox" name="readback"> Caregiver read the result back correctly</label>
        <div><button type="submit">Document call</button></div>
      </form>
    </section>` : ""}

    ${rejected ? "" : `<div class="case-grid">
      <form class="panel stack" ${tabProps("setup")} data-form="media" aria-labelledby="mh">
        <h2 id="mh">Setup</h2>
        <fieldset ${locked?"disabled":""}><legend>Media and bottles inoculated <small style="font-weight:400;color:var(--muted)">(typical setup preselected; edit to match your SOP)</small></legend>
          <div class="checks">${MEDIA.map(m => `<label><input type="checkbox" name="m" value="${esc(m)}"${mediaSel.includes(m)?" checked":""}> ${esc(m)}</label>`).join("")}</div>
        </fieldset>
        <div class="field"><label for="m-n">Incubation notes</label><input id="m-n" name="notes" ${locked?"disabled":""} value="${esc(a.media ? a.media.notes : "")}" placeholder="Example: 35 °C; BAP and CHOC in 5% CO2"></div>
        ${a.media ? `<p class="mono" style="font-size:.85rem;color:var(--muted)">Saved ${fmt(a.media.at)} by ${esc(a.media.by)}</p>` : ""}
        <div><button type="submit" ${locked?"disabled":""}>Save setup</button></div>
      </form>

      <form class="panel stack" ${tabProps("microscopy")} data-form="gram" aria-labelledby="gh">
        <h2 id="gh">Gram stain</h2>
        <div class="formgrid">
          <div class="field"><label for="g-p">PMNs</label><select id="g-p" name="pmn" ${locked?"disabled":""}>${opts(CELLS, a.gram ? a.gram.pmn : "None seen")}</select></div>
          <div class="field"><label for="g-e">Squamous epithelial cells</label><select id="g-e" name="epi" ${locked?"disabled":""}>${opts(CELLS, a.gram ? a.gram.epi : "None seen")}</select></div>
        </div>
        <fieldset ${locked?"disabled":""}><legend>Organisms seen <small style="font-weight:400;color:var(--muted)">(leave morphology blank for no organisms seen)</small></legend>
          <div class="stack" id="orgrows" style="gap:8px">${gramOrgRows}</div>
          <div style="margin-top:8px"><button type="button" class="small secondary" data-act="add-org">Add organism row</button></div>
        </fieldset>
        ${gramSummary}
        <div><button type="submit" ${locked?"disabled":""}>Save Gram stain</button></div>
      </form>
    </div>

    <section class="panel stack" ${tabProps("culture")} aria-labelledby="rdh">
      <h2 id="rdh">Plate reads</h2>
      ${a.reads.length ? `<ul class="loglist">${a.reads.map(r => `<li><div><strong>Day ${esc(r.day)}${r.medium ? " · "+esc(r.medium) : ""}</strong>${r.growth ? " · "+esc(r.growth) : ""}${r.hemolysis && r.hemolysis!=="Not assessed" ? " · "+esc(r.hemolysis)+" hemolysis" : ""}${r.note ? " · "+esc(r.note) : ""}</div><div class="meta">${fmt(r.at)} · ${esc(r.by)}</div></li>`).join("")}</ul>` : `<p style="color:var(--muted)">No reads recorded.</p>`}
      <p class="helptext">Record one medium at a time. Enter observations from the physical plate, not an assumed organism identity. Hemolysis applies to a blood agar plate when assessed.</p>
      <form class="stack" data-form="read" aria-label="Add plate read">
        <div class="formgrid">
          <div class="field"><label for="rd-d">Culture day</label><input id="rd-d" name="day" type="number" min="0" max="42" class="mono" value="${a.reads.length ? Math.max(...a.reads.map(r=>+r.day||0))+1 : 1}" ${locked?"disabled":""} required></div>
          <div class="field"><label for="rd-m">Medium examined</label><select id="rd-m" name="medium" ${locked?"disabled":""}><option value="">Select medium</option>${(a.media?.list || cx.media).map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join("")}</select></div>
          <div class="field"><label for="rd-g">Growth</label><select id="rd-g" name="growth" ${locked?"disabled":""}>${opts(["No growth","Rare","Light","Moderate","Heavy","Broth only","Other"])}</select></div>
          <div class="field"><label for="rd-h">Hemolysis (when applicable)</label><select id="rd-h" name="hemolysis" ${locked?"disabled":""}>${opts(["Not assessed","Alpha","Beta","Gamma"])}</select></div>
        </div>
        <div class="field"><label for="rd-n">Colony appearance / bench notes <small>Describe color, size, morphology, hemolysis, or additional findings. No growth may be recorded without a descriptive note.</small></label><textarea id="rd-n" name="note" ${locked?"disabled":""} rows="2" placeholder="e.g., small gray colonies; no growth on the companion medium"></textarea></div>
        <div><button type="submit" ${locked?"disabled":""}>Save plate observation</button></div>
      </form>
    </section>

    <section class="panel stack" ${tabProps("identification")} aria-labelledby="ish">
      <h2 id="ish">Isolates and susceptibility</h2>
      <p class="lede" style="font-size:.92rem">Record biochemical reactions under each isolate, then update its identification as evidence becomes available. Enter MIC or zone diameter from the actual test, then interpret using the current organism-specific breakpoint table supplied by your instructor. This simulator does not calculate susceptibility categories. Uncheck Report for selective reporting.</p>
      ${isolates || `<p style="color:var(--muted)">No isolates entered.</p>`}
      <form class="orgrow" data-form="isolate" aria-label="Add isolate">
        <div class="field"><label for="is-n">Isolate label / current ID <small>Use “Unknown A” until identification is complete.</small></label><input id="is-n" name="name" required ${locked?"disabled":""} placeholder="Unknown A"></div>
        <div class="field"><label for="is-q">Quantity</label><select id="is-q" name="qty" ${locked?"disabled":""}>${opts(QTY[cx.qty])}</select></div>
        <div class="field"><label for="is-m">ID method</label><select id="is-m" name="method" ${locked?"disabled":""}>${opts(ID_METHODS)}</select></div>
        <button type="submit" class="secondary" ${locked?"disabled":""}>Add isolate</button>
      </form>
    </section>

    <form class="panel stack" ${tabProps("report")} data-form="flags" aria-labelledby="flh">
      <h2 id="flh">Infection prevention and public health</h2>
      <div class="checks">
        <label><input type="checkbox" name="ip" ${a.flags.ip?"checked":""} ${locked?"disabled":""}> Copy to Infection Prevention (for example MRSA, VRE, ESBL, CRE)</label>
        <label><input type="checkbox" name="ph" ${a.flags.ph?"checked":""} ${locked?"disabled":""}> Reportable to state public health</label>
      </div>
      <div class="field"><label for="fl-n">Notification note</label><input id="fl-n" name="note" value="${esc(a.flags.note)}" ${locked?"disabled":""} placeholder="Who was notified and when"></div>
      <div><button type="submit" class="secondary" ${locked?"disabled":""}>Save flags</button></div>
    </form>`}

    <section class="panel stack" ${tabProps("report")} aria-labelledby="reph">
      <div class="row" style="justify-content:space-between"><h2 id="reph">Reports</h2>${a.reports.length ? '<span class="pill Final">Versioned history</span>' : ''}</div>
      <p class="helptext">Before releasing a final result, confirm the following documentation. A preliminary result may be released earlier when reportable findings are available, subject to critical communication rules.</p>
      <div class="readiness" aria-label="Final report checklist">${ready.map(([label,ok])=>`<div class="readiness-item ${ok ? "ready" : ""}"><span aria-hidden="true">${ok ? "✓" : "○"}</span>${esc(label)}</div>`).join("")}</div>
      ${a.receipt ? `<form class="stack" data-form="release">
        ${rejected ? "" : `<div class="field"><label for="st">Culture result statement <small>Appears on the report. Example: No growth at 2 days, culture continuing.</small></label><textarea id="st" name="stmt">${esc(a.stmt)}</textarea></div>`}
        ${hasFinal ? `<fieldset><legend>Corrected report</legend>
          <p style="font-size:.92rem;margin-bottom:8px">Edit the workup above, then issue the correction. The released versions stay on file unchanged.</p>
          <div class="formgrid">
            <div class="field"><label for="cr-r">What was wrong</label><input id="cr-r" name="reason" placeholder="Example: Isolate 1 identification entered on wrong accession"></div>
            <div class="field"><label for="cr-n">Who was notified of the error</label><input id="cr-n" name="notified" placeholder="Full name and credential"></div>
          </div></fieldset>` : ""}
        <div class="row">
          ${rejected ? `<button type="submit" name="type" value="Final" ${a.reports.length?"disabled":""}>Release rejection notice</button>`
          : hasFinal ? `<button type="submit" name="type" value="Corrected">Issue corrected report</button>`
          : `<button type="submit" name="type" value="Preliminary" class="secondary">Release preliminary</button><button type="submit" name="type" value="Final">Release final</button>`}
        </div>
      </form>` : `<p style="color:var(--muted)">Reports become available after the specimen is received.</p>`}
      <details><summary>Preview of the next report</summary>${reportHTML(a, hasFinal ? "Corrected" : "Preliminary", { preview:true })}</details>
      ${reports ? `<h3>Released versions</h3><div><button type="button" class="small secondary" data-act="print-latest">Print latest report</button></div>${reports}` : `<p style="color:var(--muted)">No reports released.</p>`}
    </section>
      </div><!-- case stage -->
    </div><!-- case shell -->
    <datalist id="druglist">${DRUGS.map(d => `<option value="${esc(d)}">`).join("")}</datalist>
  </div>`;
}
function orgRow(o, i){
  return `<div class="orgrow" data-orgrow>
    <div class="field"><label for="om-${i}">Morphology</label><select id="om-${i}" name="morph"><option value="">(none)</option>${opts(MORPH, o.morph)}</select></div>
    <div class="field" style="flex:0 1 150px"><label for="oq-${i}">Quantity</label><select id="oq-${i}" name="oqty">${opts(ORGQ, o.qty)}</select></div>
    <button type="button" class="small secondary" data-act="del-org" style="margin-bottom:6px">Remove row</button>
  </div>`;
}

function reportHTML(a, type, meta){
  const p = patient(a.pid);
  const rejected = a.receipt && !a.receipt.ok;
  const gram = a.gram ? `${esc(a.gram.pmn)} PMNs. ${esc(a.gram.epi)} squamous epithelial cells. ${a.gram.orgs.length ? a.gram.orgs.map(o => esc(o.qty+" "+o.morph.toLowerCase())).join(". ")+"." : "No organisms seen."}` : "";
  const iso = a.isolates.map((s, i) => {
    const rows = s.ast.filter(r => r.report);
    return `<p><strong>${i+1}. ${esc(s.qty)} <em>${esc(s.name)}</em></strong></p>${rows.length ? `<div class="tablewrap"><table><thead><tr><th scope="col">Antimicrobial</th><th scope="col">Result</th><th scope="col">Interpretation</th></tr></thead><tbody>${rows.map(r => `<tr><td>${esc(r.drug)}</td><td class="mono">${esc(r.value)} ${esc(r.unit.split(" ")[0])}</td><td class="mono">${({S:"Susceptible",I:"Intermediate",SDD:"Susceptible-dose dependent",R:"Resistant"})[r.interp]||esc(r.interp)}</td></tr>`).join("")}</tbody></table></div>` : ""}`;
  }).join("");
  const validCalls = a.calls.filter(validCall);
  const prev = a.reports[a.reports.length-1];
  return `<div class="report">
    ${type==="Corrected" ? `<div class="corr">CORRECTED REPORT. Replaces version ${prev ? prev.version : "?"} released ${prev ? fmt(prev.at) : "?"}.${meta.reason ? " Reason: "+esc(meta.reason)+"." : ""}${meta.notified ? " Error reported to "+esc(meta.notified)+"." : ""}</div>` : ""}
    <div class="rh"><div><strong>${esc(LAB.name)}</strong><br>${esc(LAB.addr)}</div><div class="status">${esc(type.toUpperCase())} REPORT${meta.preview ? " (PREVIEW)" : ""}</div></div>
    <dl>
      <dt>Patient</dt><dd>${esc(pname(p))}</dd><dt>MRN</dt><dd>${esc(p.mrn)}</dd><dt>DOB</dt><dd>${fmtDate(p.dob)}</dd>
      <dt>Accession</dt><dd>${showAcc(a.acc)}</dd><dt>Test</dt><dd>${esc(a.culture)}</dd><dt>Source</dt><dd>${esc(a.source)}: ${esc(a.site)}</dd>
      <dt>Collected</dt><dd>${fmt(a.collected)}</dd><dt>Received</dt><dd>${a.receipt ? fmt(a.receipt.at) : "—"}</dd>
      <dt>Ordered by</dt><dd>${esc(a.provider)}</dd><dt>Report date</dt><dd>${meta.preview ? "(set at release)" : fmt(meta.at)}</dd>
    </dl>
    ${rejected ? `<h4>Specimen disposition</h4><p>Specimen rejected: ${esc(a.receipt.reason)}. ${esc(a.receipt.note)} No testing performed.</p>` : `
      ${gram ? `<h4>Gram stain</h4><p>${gram}</p>` : ""}
      <h4>Culture</h4>${iso || ""}${a.stmt ? `<p>${esc(a.stmt)}</p>` : (iso ? "" : "<p>(No result statement entered.)</p>")}
      ${validCalls.length ? `<h4>Critical result notification</h4>${validCalls.map(c => `<p>Called to ${esc(c.name)}, ${esc(c.cred)}, ${esc(c.where)}, ${fmt(c.at)}. Read-back confirmed. Called by ${esc(c.by)}.</p>`).join("")}` : ""}
      ${a.flags.ip || a.flags.ph ? `<h4>Notifications</h4><p>${a.flags.ip ? "Copied to Infection Prevention. " : ""}${a.flags.ph ? "Reportable to state public health. " : ""}${esc(a.flags.note)}</p>` : ""}`}
    <p style="margin-top:12px;font-size:.8rem">${meta.preview ? "" : "Released by "+esc(meta.by)+". "}Educational simulation. Not a patient record.</p>
  </div>`;
}

function vAudit(){
  const accs = [...new Set(S.audit.map(e => e.acc).filter(Boolean))];
  const list = S.audit.filter(e => !ui.auditFilter || e.acc === ui.auditFilter).slice().reverse();
  return `<div class="stack">
    <div class="stack" style="gap:6px"><h1>Audit log</h1>
    <p class="lede">Recorded changes in this browser, stamped with the signed-in technologist. This teaching log is not tamper-proof and can be erased with simulator storage.</p></div>
    <form class="panel row" data-form="auditfilter" aria-label="Filter audit log">
      <div class="field"><label for="af">Accession</label><select id="af" name="acc" class="mono"><option value="">All accessions</option>${accs.map(x => `<option value="${x}"${x===ui.auditFilter?" selected":""}>${showAcc(x)}</option>`).join("")}</select></div>
      <button type="submit" class="secondary">Filter</button>
    </form>
    <div class="panel tablewrap"><table><caption class="eyebrow" style="text-align:left;padding-bottom:8px">${list.length} entr${list.length===1?"y":"ies"}</caption>
      <thead><tr><th scope="col">Time</th><th scope="col">Tech</th><th scope="col">Accession</th><th scope="col">Action</th><th scope="col">Detail</th></tr></thead>
      <tbody>${list.map(e => `<tr><td class="mono">${fmt(e.at)}</td><td class="mono">${esc(e.by)}</td><td class="mono">${e.acc ? `<a href="#case-${e.acc}">${showAcc(e.acc)}</a>` : "—"}</td><td>${esc(e.action)}</td><td>${esc(e.detail)}</td></tr>`).join("") || `<tr><td colspan="5">No entries.</td></tr>`}</tbody>
    </table></div>
  </div>`;
}

function bytesUsed(){ try { return (lsGet(SKEY)||"").length + (lsGet(DKEY)||"").length; } catch(e){ return 0; } }
function vStorage(){
  const d = env.device;
  const kb = (bytesUsed()*2/1024).toFixed(1);
  const pend = ui.importPending;
  return `<div class="stack">
    <div class="stack" style="gap:6px"><h1>Save & transfer</h1>
    <p class="lede">Everything in this simulator is saved inside this browser on this computer. No simulator records are sent to an application server. Browser data can be erased by device policy or user action. Use this screen to test persistence and transfer work with a save file. Never enter real patient information.</p></div>

    <div class="tiles">
      <div class="tile ${env.storageOK?"good":"bad"}"><span class="k">Browser storage</span><span class="v">${env.storageOK ? "Working" : "Blocked"}</span></div>
      <div class="tile"><span class="k">This browser's ID</span><span class="v big">${esc(d.id)}</span></div>
      <div class="tile"><span class="k">ID created</span><span class="v" style="font-size:1rem">${fmt(d.firstSeen)}</span></div>
      <div class="tile ${env.deviceIsNew?"bad":"good"}"><span class="k">On this page load</span><span class="v" style="font-size:1rem">${env.deviceIsNew ? "New ID: nothing was stored here before" : "Same ID as last time: storage kept"}</span></div>
      <div class="tile"><span class="k">Opens in this browser</span><span class="v">${d.loads}</span></div>
      <div class="tile"><span class="k">Opens this session</span><span class="v">${env.sessionLoads}</span></div>
      <div class="tile"><span class="k">Accessions stored</span><span class="v">${S.accessions.length}</span></div>
      <div class="tile"><span class="k">Space used</span><span class="v">${kb} KB</span></div>
    </div>

    <div class="grid2">
      <section class="panel stack" aria-labelledby="th">

const forms = {
  tech(f){ const v = f.tech.value.trim(); if(!v) return; const old = S.tech; S.tech = v; audit("", "Tech signed in", old ? `Changed from ${old}` : ""); commit(`Signed in as ${v}. Every action is stamped with this name.`); },
  order(f){

  lookup(f){

  reject(f){
    if(needTech()) return;

    a.receipt = { at: nowISO(), by: S.tech, ok: false, reason: f.reason.value, note: f.note.value.trim() };
    audit(a.acc, "Specimen rejected", `${a.receipt.reason}. ${a.receipt.note}`);
    ui.receiveAcc = null; commit(`${showAcc(a.acc)} rejected: ${a.receipt.reason}.`, "warn");
  },
  media(f){
    if(needTech()) return; const a = curCase(); if(!a) return;
    const list = [...f.querySelectorAll('input[name="m"]:checked')].map(x => x.value);
    if(!list.length){ flash("Select at least one medium or bottle.", "crit"); return; }
    a.media = { list, notes: f.notes.value.trim(), at: nowISO(), by: S.tech };
    audit(a.acc, "Setup saved", list.join(", ")); ui.caseTab="microscopy"; commit("Setup saved. Continue with microscopy or plate reading.");
  },
  gram(f){
    if(needTech()) return; const a = curCase(); if(!a) return;
    const orgs = [...f.querySelectorAll("[data-orgrow]")].map(r => ({ morph: r.querySelector('[name="morph"]').value, qty: r.querySelector('[name="oqty"]').value })).filter(o => o.morph);
    a.gram = { pmn: f.pmn.value, epi: f.epi.value, orgs, at: nowISO(), by: S.tech };
    audit(a.acc, "Gram stain saved", orgs.length ? orgs.map(o => o.qty+" "+o.morph).join("; ") : "No organisms seen");
    if(criticalDue(a)){ ui.caseTab="report"; commit("Gram stain saved. This is a critical result. Call it and document the call before releasing a report.", "crit"); }

  read(f){

    if(hemolysis!=="Not assessed" && medium!=="BAP"){ flash("Record hemolysis only for the blood agar plate (BAP) in this exercise.","crit"); return; }

  },
  isolate(f){

  biochem(f){

    if((iso.tests||[]).some(t=>t.test===test)){flash("This reaction is already recorded. Remove the old entry before replacing it.","crit");return;}

  ast(f){

    const row = { drug: f.drug.value.trim(), value: f.value.value.trim(), unit: f.unit.value, interp: f.interp.value, report: f.report.checked };
    if(iso.ast.some(r=>r.drug.toLowerCase()===row.drug.toLowerCase())){ flash("This drug is already recorded for the isolate. Remove the old result before replacing it.","crit"); return; }

  flags(f){

  call(f){

  release(f, submitter){
    if(needTech()) return; const a = curCase(); if(!a) return;
    const type = (submitter && submitter.value) || (f.querySelector('button[type="submit"]') || {}).value || "Preliminary";
    if(a.reports.some(r => r.type === "Final") && type !== "Corrected" && !(a.receipt && !a.receipt.ok)){ flash("A final report already exists. Issue a corrected report instead.", "crit"); return; }
    if(f.stmt) a.stmt = f.stmt.value.trim();
    if(criticalDue(a)){ save(); render(); flash("Report not released. Document the critical call with a full name and confirmed read-back first.", "crit"); return; }
    const rejected = a.receipt && !a.receipt.ok;
    if(!rejected && !a.stmt && !a.isolates.length && !a.gram){ flash("Nothing to report yet. Record a Gram stain, a culture result statement, or an isolate.","crit"); return; }

  },
  auditfilter(f){ ui.auditFilter = f.acc.value; render(); },
  import(f){
    const file = f.file.files && f.file.files[0];
    const done = text => {
      let obj = null; try { obj = JSON.parse(String(text).trim()); } catch(e){}

    try { navigator.clipboard.writeText(t.value).then(() => flash("Save code copied. Paste it somewhere you can reach from another computer.", "ok"), fallback); } catch(e){ fallback(); } },
  download(){ try { const blob = new Blob([exportCode()], {type:"application/json"}); const u = URL.createObjectURL(blob); const el = document.createElement("a"); const d = new Date();
      el.href = u; el.download = `micro-lis-save-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`; document.body.appendChild(el); el.click(); el.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); flash("Save file downloaded.", "ok"); } catch(e){ flash("Download is blocked here. Use Copy save code instead.", "crit"); } },
  persist(){ navigator.storage.persist().then(p => { env.persisted = p; render(); flash(p ? "The browser agreed to protect this data from automatic cleanup." : "The browser declined. This is common and does not affect sign-out cleanup.", p ? "ok" : "warn"); }).catch(() => flash("This browser does not support that request.", "warn")); },
  "import-yes"(){ const keepTech = S.tech; S = ui.importPending; ui.importPending = null; if(keepTech && !S.tech) S.tech = keepTech; audit("", "Save code loaded", `${S.accessions.length} accessions`); commit(`Save code loaded. ${S.accessions.length} accessions are now in this browser.`); },
  "import-no"(){ ui.importPending = null; render(); flash("Load cancelled. Nothing changed.", "info"); }
};

function printContent(html){
  const area=$("#print-area"); area.innerHTML=html;
  document.body.classList.add("printing");
  area.hidden=false;
  // The afterprint event restores the workstation after the print dialog.
  requestAnimationFrame(()=>window.print());
}
window.addEventListener("afterprint",()=>{
  const area=$("#print-area");
  if(area){area.innerHTML="";area.hidden=true;}
  document.body.classList.remove("printing");
});
document.addEventListener("input",e=>{
  if(e.target?.id==="wl-search") filterWorklist();
  if(e.target?.closest(".case-stage form")) ui.caseDirty=true;
});
document.addEventListener("change",e=>{
  if(["wl-status","wl-priority"].includes(e.target?.id)) filterWorklist();
  if(e.target?.closest(".case-stage form")) ui.caseDirty=true;
});
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]"); if(!f) return;
  e.preventDefault();
  const F = new Proxy(f, { get(t, k){ if(typeof k === "string"){ const el = t.elements.namedItem(k); if(el) return el; } const v = t[k]; return typeof v === "function" ? v.bind(t) : v; } });
  const h = forms[f.dataset.form]; if(h) h(F, e.submitter);
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const h = acts[b.dataset.act]; if(h){ e.preventDefault(); h(b); }
});

/* ---------- boot ---------- */
initDevice();
const preferredTheme = lsGet(THEMEKEY);
if(["light","dark"].includes(preferredTheme)) document.documentElement.dataset.theme = preferredTheme;
load();
render();
if(!env.storageOK) flash("This browser is blocking storage, so nothing will be kept when the page closes. Use Copy save code on the Save &amp; transfer screen before you leave.", "crit");
else if(env.seededThisLoad && !env.deviceIsNew) flash("Simulator data was missing, so the example orders were restored. Your browser ID was kept.", "warn");
})();
</script>
